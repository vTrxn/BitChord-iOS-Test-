name: Build BitChord iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate 2>&1 | tee xcodegen.log

      - name: Build Application
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project BitChord.xcodeproj \
            -scheme BitChord \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/BitChord.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean archive 2>&1 | tee build/build.log

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/BitChord.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Built app bundle not found."
            find build -maxdepth 5
            exit 1
          fi
          
          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r -9 BitChord.ipa Payload
          echo "IPA packaged successfully at build/BitChord.ipa"

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-iOS-IPA
          path: build/BitChord.ipa
          retention-days: 14

      - name: Report Build Diagnostics
        if: always()
        run: |
          echo "### Build Diagnostics" >> $GITHUB_STEP_SUMMARY
          if [ -f xcodegen.log ]; then
            echo "#### XcodeGen Output" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat xcodegen.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f build/build.log ]; then
            echo "#### xcodebuild Output" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat build/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
