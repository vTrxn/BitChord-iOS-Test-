name: Build BitChord iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate || python3 generate_project.py

      - name: Build Application
        run: |
          mkdir -p build
          xcodebuild build \
            -project BitChord.xcodeproj \
            -scheme BitChord \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/derivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Searching for any .app in build directory..."
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Built app bundle not found."
            find build -maxdepth 5
            exit 1
          fi
          
          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r -9 BitChord.ipa Payload
          echo "IPA packaged successfully at build/BitChord.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-iOS-IPA
          path: build/BitChord.ipa
          retention-days: 14
