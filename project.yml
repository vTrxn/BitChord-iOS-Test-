name: BitChord
options:
  bundleIdPrefix: com.bitchord
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  BitChord:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BitChord
    info:
      path: BitChord/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitchord.ios
        PRODUCT_NAME: BitChord
        INFOPLIST_FILE: BitChord/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

schemes:
  BitChord:
    build:
      targets:
        BitChord: all
    run:
      config: Debug
    archive:
      config: Release
